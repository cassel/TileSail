name: TileSail checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: ./.github/gh-actions-runner-xcode-select.sh
      - name: Test
        run: swift test
      - name: Build TileSail app
        run: >-
          xcodebuild -project xcode/AeroSpace.xcodeproj -scheme AeroSpace
          -configuration Debug -derivedDataPath .build/xcode
          CODE_SIGNING_ALLOWED=NO build
      - name: Build release CLI
        run: swift build -c release --product tilesail
